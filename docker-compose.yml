version: '3.8'

services:
  # 1. Official Bitwarden Web Vault Frontend
  web:
    image: bitwarden/web:latest
    container_name: bitwarden-web
    restart: always
    ports:
      - "${PORT:-80}:80"
    environment:
      - globalSettings__baseServiceUri__vault=http://localhost

  # 2. Official Bitwarden API Backend
  api:
    image: bitwarden/api:latest
    container_name: bitwarden-api
    restart: always
    environment:
      - globalSettings__selfHosted=true
      - globalSettings__baseServiceUri__vault=http://localhost
    volumes:
      - bwdata:/etc/bitwarden

  # 3. Official Bitwarden Identity Service
  identity:
    image: bitwarden/identity:latest
    container_name: bitwarden-identity
    restart: always
    environment:
      - globalSettings__selfHosted=true
      - globalSettings__baseServiceUri__vault=http://localhost
    volumes:
      - bwdata:/etc/bitwarden

volumes:
  bwdata: